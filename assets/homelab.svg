<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 332" width="540" height="332" role="img" aria-labelledby="t">
<title id="t">Terminal connecting to Leo's home server</title>
<style>
:root{--bg:#f6f8fa;--bar:#eaeef2;--line:#d0d7de;--fg:#1f2328;--muted:#59636e;--ok:#1a7f37;--wait:#9a6700;--accent:#8250df}
@media (prefers-color-scheme:dark){:root{--bg:#161b22;--bar:#21262d;--line:#30363d;--fg:#e6edf3;--muted:#8b949e;--ok:#3fb950;--wait:#d29922;--accent:#a371f7}}
text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}
.bg{fill:var(--bg);stroke:var(--line)}
.bar{fill:var(--bar)}
.rule{stroke:var(--line)}
.dot{fill:var(--line)}
.title{fill:var(--muted);font-size:12px;text-anchor:middle}
.fg{fill:var(--fg)}
.muted{fill:var(--muted)}
.ok{fill:var(--ok)}
.wait{fill:var(--wait)}
.accent{fill:var(--accent)}
.strong{font-weight:700}
.a{opacity:0;animation:show .01s linear forwards}
.flash{opacity:0;animation:flash 0.3s linear forwards}
.typing{animation:travel var(--duration) steps(var(--steps),end) var(--start) forwards,hide .01s linear var(--hide) forwards}
.end{opacity:0;animation:blink 1s step-end var(--start) 4 forwards}
@keyframes show{to{opacity:1}}
@keyframes flash{0%,99%{opacity:1}100%{opacity:0}}
@keyframes travel{to{transform:translateX(var(--travel))}}
@keyframes hide{to{opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.a,.end{opacity:1;animation:none}.flash,.typing{display:none}}
</style>
<rect class="bg" x=".5" y=".5" width="539" height="331" rx="10"/>
<path class="bar" d="M1 38V11a10 10 0 0 1 10-10h518a10 10 0 0 1 10 10v27z"/>
<line class="rule" x1="1" x2="539" y1="38" y2="38"/>
<circle class="dot" cx="20" cy="19.5" r="5"/><circle class="dot" cx="38" cy="19.5" r="5"/><circle class="dot" cx="56" cy="19.5" r="5"/>
